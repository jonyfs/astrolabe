<style>
/* Layout: sticky instrument bar with board index; boards stacked, each scaled to the column, 1:1 in an overlay. Single dark look, matching the mocha terminal it depicts. */
:root{
  --crust:#11111b; --mantle:#181825; --base:#1e1e2e; --surface:#313244; --line:#45475a;
  --text:#cdd6f4; --sub:#a6adc8; --faint:#9399b2; --accent:#cba6f7; --peach:#fab387;
  --display:'Fraunces', Georgia, serif; --sans:'IBM Plex Sans', system-ui, sans-serif; --mono:'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
body{background:var(--crust);color:var(--text);font-family:var(--sans);font-size:15px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--crust) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--surface)}
.bar-in{max-width:1500px;margin:0 auto;padding-block:12px;padding-inline:24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{margin:0;font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-0.01em}
.brand span{font-family:var(--mono);font-size:12px;color:var(--faint)}
nav{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
nav a{font-family:var(--mono);font-size:13px;color:var(--sub);text-decoration:none;padding:6px 10px;border:1px solid var(--surface);border-radius:4px;min-height:32px;box-sizing:border-box;display:inline-flex;align-items:center}
nav a:hover,nav a:focus-visible{color:var(--crust);background:var(--accent);border-color:var(--accent);outline:none}
nav a.on{border-color:var(--accent);color:var(--accent)}
main{max-width:1500px;margin:0 auto;padding-block:32px 80px;padding-inline:24px;display:flex;flex-direction:column;gap:56px}
.intro{max-width:68ch;color:var(--sub);line-height:1.6;margin:0}
.intro b{color:var(--text);font-weight:600}
section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:96px}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.num{font-family:var(--mono);font-size:13px;color:var(--peach);border:1px solid var(--peach);border-radius:3px;padding:1px 7px}
.head h2{margin:0;font-family:var(--display);font-weight:500;font-size:22px;text-wrap:balance}
.meta{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.head button{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--text);background:var(--base);border:1px solid var(--line);border-radius:4px;padding:6px 12px;min-height:36px;cursor:pointer}
.head button:hover,.head button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.frame{position:relative;overflow:hidden;border:1px solid var(--surface);border-radius:6px;background:var(--crust);cursor:zoom-in}
.frame > .board{position:absolute;top:0;left:0;transform-origin:0 0}
.overlay{position:fixed;inset:0;z-index:20;background:var(--crust);display:flex;flex-direction:column}
.ov-bar{display:flex;align-items:center;gap:12px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--surface);background:var(--mantle)}
.ov-bar h3{margin:0;font-family:var(--display);font-weight:500;font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-bar button{font-family:var(--mono);font-size:13px;color:var(--text);background:var(--base);border:1px solid var(--line);border-radius:4px;padding:6px 12px;min-height:36px;cursor:pointer}
.ov-bar button:hover,.ov-bar button:focus-visible{border-color:var(--accent);color:var(--accent);outline:none}
.ov-scroll{flex:1;overflow:auto;padding:24px}
.hint{font-family:var(--mono);font-size:12px;color:var(--faint)}
@media (max-width:640px){.bar-in,main{padding-inline:16px}.head button{margin-left:0}}

r: #a6adc8\"><span style=\"color: #cdd6f4; font-weight: 600\">Colour means one thing per chip.<\/span> Level on ctx, 5h, 7d and spend; a 30 s brighten on branch, PR, skills and model; identity elsewhere. Usage chips never brighten.<\/div>\n<div style=\"background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #a6adc8\"><span style=\"color: #cdd6f4; font-weight: 600\">Nothing slow on draw (XII).<\/span> git, gh, CI and the process list run on $.clock (15 s for gates, 5 min for PR/CI) into $.state; render only reads.<\/div>\n<div style=\"background: #181825; border: 1px solid #313244; border-radius: 8px; padding: 12px 14px; font-size: 13px; line-height: 1.5; color: #a6adc8\"><span style=\"color: #cdd6f4; font-weight: 600\">Spec Kit takes L2's head.<\/span> With Spec Kit the todo chip yields to <span style=\"font-family: 'IBM Plex Mono', monospace; color: #cdd6f4\">◆ 059 specify<\/span>; without it the todo list leads.<\/div>\n<\/div>\n<\/div>\n\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<div style=\"font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #cba6f7\">Pane footer, 3 lines, 180 columns (footerIn=status draws the same under the prompt)<\/div>\n<div class=\"term\" style=\"width: 1404px\">\n<div class=\"ln\"><span class=\"c tx\"> ⌂ astrolabe <\/span><span class=\"c mu\"> jonyfs/astrolabe <\/span><span class=\"cB la\"> ⎇ 063-statusline-parity ⇐ main <\/span><span class=\"c tx\"> <span class=\"ye\">●3<\/span> <span class=\"dn\">+7<\/span> <span class=\"bl\">✖2<\/span> <span class=\"te\">⇡2<\/span> <span class=\"bf\">⇣5<\/span> <\/span><span class=\"c mu\"> +156 −23 <\/span><span class=\"c tx\"> PR #41 <span class=\"pe\">draft · ux<\/span> <\/span><span class=\"c dn\"> ✓ CI <\/span><\/div>\n<div class=\"ln\"><span class=\"c ac\"> ◆ 059 specify <\/span><span class=\"cB la\"> ❖ humanizer, dataviz, mermaid +2 <\/span><span class=\"c tx iv>\n\n<\/div>\n\n<\/div>\n\n<\/div>"}];
const main = document.getElementById('main');
const nav = document.getElementById('nav');
const frames = [];
BOARDS.forEach((b, i) => {
  const n = String(i + 1);
  const a = document.createElement('a');
  a.href = '#' + b.id; a.textContent = n; a.title = b.title;
  nav.appendChild(a);
  const s = document.createElement('section');
  s.id = b.id;
  const title = b.title.replace(/^\d+\s*·\s*/, '');
  s.innerHTML = '<div class="head"><span class="num">' + n + '</span><h2></h2><span class="meta">' + b.w + ' × ' + b.h + ' px · ' + b.file + '</span><button type="button">1:1</button></div><div class="frame"></div>';
  s.querySelector('h2').textContent = title;
  const frame = s.querySelector('.frame');
  const board = document.createElement('div');
  board.className = 'board ' + b.id;
  board.innerHTML = b.html;
  frame.appendChild(board);
  frame.addEventListener('click', () => openAt(i));
  s.querySelector('button').addEventListener('click', () => openAt(i));
  main.appendChild(s);
  frames.push({ frame, board, b });
});
function fit() {
  frames.forEach(({ frame, board, b }) => {
    const k = Math.min(1, frame.clientWidth / b.w);
    board.style.transform = 'scale(' + k + ')';
    frame.style.height = Math.round(b.h * k) + 'px';
  });
}
window.addEventListener('resize', fit);
fit();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

const ov = document.getElementById('ov');
const ovScroll = document.getElementById('ov-scroll');
let cur = 0;
function openAt(i) {
  cur = (i + BOARDS.length) % BOARDS.length;
  const b = BOARDS[cur];
  document.getElementById('ov-title').textContent = (cur + 1) + ' · ' + b.title.replace(/^\d+\s*·\s*/, '');
  document.getElementById('ov-meta').textContent = b.w + ' × ' + b.h;
  ovScroll.innerHTML = '';
  const d = document.createElement('div');
  d.className = b.id; d.style.width = b.w + 'px';
  d.innerHTML = b.html;
  ovScroll.appendChild(d);
  ovScroll.scrollTo(0, 0);
  ov.hidden = false;
  document.body.style.overflow = 'hidden';
  document.getElementById('ov-close').focus();
}
function closeOv() { ov.hidden = true; ovScroll.innerHTML = ''; document.body.style.overflow = ''; }
document.getElementById('ov-close').addEventListener('click', closeOv);
document.getElementById('ov-prev').addEventListener('click', () => openAt(cur - 1));
document.getElementById('ov-next').addEventListener('click', () => openAt(cur + 1));
document.addEventListener('keydown', (e) => {
  if (ov.hidden) return;
  if (e.key === 'Escape') closeOv();
  else if (e.key === 'ArrowLeft') openAt(cur - 1);
  else if (e.key === 'ArrowRight') openAt(cur + 1);
});
const links = [...nav.querySelectorAll('a')];
const io = new IntersectionObserver((es) => {
  es.forEach((e) => { if (e.isIntersecting) links.forEach((l) => l.classList.toggle('on', l.getAttribute('href') === '#' + e.target.id)); });
}, { rootMargin: '-40% 0px -55% 0px' });
document.querySelectorAll('main section').forEach((s) => io.observe(s));
</script>
