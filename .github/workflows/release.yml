name: Release

# A release comes only from a vX.Y.Z tag whose version equals plugin.json's
# (Constitution Principle XIV), after every check passes again on the tagged commit:
# a tag can point at a commit that never went through a pull request.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag equals plugin.json version
        run: sh scripts/check-release-version.sh "${GITHUB_REF_NAME}"

  verify:
    needs: version
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Same engine as CI and as types/engine/claude-code.d.ts.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.292
      - name: Validate the plugin and marketplace
        run: claude plugin validate .
      - name: Run the plugin tests
        run: claude plugin test .
      - name: Type check
        run: npx -y -p typescript@5 tsc -p .

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Install or update (Claude Code 2.1.292 or later):"
            echo
            echo '```text'
            echo "/plugin install astrolabe --marketplace jonyfs/astrolabe"
            echo '```'
            echo
            echo "Already installed: \`claude plugin update astrolabe@astrolabe\`, then \`/reload-plugins\`."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" --title "Astrolabe ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes --verify-tag
