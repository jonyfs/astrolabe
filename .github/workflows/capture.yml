name: Desktop App Capture

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture Desktop App Views
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build desktop app (placeholder)
        run: echo "Build desktop app here" && mkdir -p dist/app
      - name: Run capture
        run: npm run capture
      - name: Upload capture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-captures
          path: docs/assets/captures/
          retention-days: 30