name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: validate, test, type check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hung step fails the job instead of holding the merge gate for an hour (054).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pinned to the engine that wrote types/engine/claude-code.d.ts. Bump both together:
      # update this version, then run scripts/sync-engine-types.sh.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.292
      - name: Validate the plugin and marketplace
        run: claude plugin validate .
      - name: Run the plugin tests
        timeout-minutes: 10
        run: claude plugin test .
      - name: Fetch the engine declarations for the type check
        shell: bash
        run: sh scripts/fetch-engine-types.sh 2.1.292
      - name: Type check
        run: npx -y -p typescript@5 tsc -p .
      - name: Test the release version and README sync checks
        if: runner.os != 'Windows'
        run: |
          sh scripts/test-check-release-version.sh
          sh scripts/test-check-readme-sync.sh
      - name: version.ts equals plugin.json
        if: runner.os != 'Windows'
        run: sh scripts/check-release-version.sh "v$(sed -n 's/^[[:space:]]*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json | head -n 1)"
      - name: README in sync
        shell: bash
        run: sh scripts/check-readme-sync.sh
      - name: Test the image converter
        timeout-minutes: 3
        run: node scripts/capture/ansi-to-svg.test.mjs
